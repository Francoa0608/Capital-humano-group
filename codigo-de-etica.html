        body {
            cursor: default;
        }

        .custom-cursor-dot {
            position: fixed;
            top: 0;
            left: 0;
            width: 8px;
            height: 8px;
            background-color: #10B981;
            border-radius: 50%;
            pointer-events: none;
            z-index: 99999;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 10px #10B981, 0 0 16px rgba(16, 185, 129, 0.8);
            transition: transform 0.08s ease-out;
        }

            width: 100%;
